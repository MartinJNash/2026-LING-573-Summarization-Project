[project]
name = "2026-ling-573-summarization-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate",
    "bert-score",
    "datasets>=2.17.0",
    "evaluate",
    "nltk",
    "numpy",
    "pandas",
    "peft",
    "pyyaml",
    "regex",
    "requests",
    "rouge-score",
    "safetensors",
    "textstat",
    "easse",
    "openai",
    "tokenizers",
    "torch",
    "torchvision",
    "tqdm",
    "transformers>=4.50",
    "spacy",
    "ollama",
    "huggingface-hub>=1.5.0",
]

[tool.uv]
override-dependencies = [
    "huggingface-hub>=1.5.0",
    "datasets>=2.17.0",
]

# On Linux (Patas/Hyak GPU nodes) install CUDA 12.4 torch instead of CPU-only PyPI torch
# cu124 has torch 2.6+/2.7+ which unlocks vllm 0.8+ (compatible with current transformers)
# cu121 only went up to torch 2.5.1, which forced vllm down to 0.7.3 (too old for transformers)
[tool.uv.sources]
easse = { git = "https://github.com/feralvam/easse.git" }
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
