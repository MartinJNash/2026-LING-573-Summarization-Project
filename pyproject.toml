[project]
name = "2026-ling-573-summarization-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate",
    "bert-score",
    "datasets>=2.17.0",
    "evaluate",
    "nltk",
    "numpy",
    "pandas",
    "peft",
    "pyyaml",
    "regex",
    "rouge-score",
    "safetensors",
    "scispacy",
    "textstat",
    "tokenizers",
    "torch",
    "tqdm",
    "transformers",
]

[tool.uv]
override-dependencies = [
    # transformers needs <1.0, peft needs >=0.20.0 for errors module
    "huggingface-hub>=0.20.0,<1.0",
    "datasets>=2.17.0",
]

# On Linux (Patas/Hyak GPU nodes) install CUDA 11.8 torch instead of CPU-only PyPI torch
[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
